serenity {
  project.name = "Prueba Pichincha - Automatización"
  take.screenshots = AFTER_EACH_STEP
  logging = VERBOSE
  console.colors = true
}

webdriver {
  driver = chrome
  wait.for.timeout = 15000
  timeouts.implicitlywait = 5000

  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "start-maximized", "incognito", "disable-infobars",
              "disable-gpu", "no-sandbox", "disable-dev-shm-usage", "lang=es"]
    }
  }
}

# Ejecutar sin interfaz: gradlew test -Dheadless.mode=true
headless.mode = false

# Seleccionar ambiente: gradlew test -Denvironment=qa
environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com/"
  }
  qa {
    webdriver.base.url = "https://www.demoblaze.com/"
  }
  stg {
    webdriver.base.url = "https://www.demoblaze.com/"
  }
}
